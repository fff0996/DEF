<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="580" viewBox="0 0 2000 580"><rect width="2000" height="580" fill="#FFFFFF"/><text x="40" y="54" dominant-baseline="middle"><tspan font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="40" font-weight="700" fill="#32549C">peak_annotation</tspan><tspan dx="22" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#222222">Peak 유전체 주석</tspan><tspan dx="12" font-family="Pretendard, sans-serif" font-size="22" font-weight="500" fill="#3A3A3A">(Peak annotation)</tspan></text><line x1="40" y1="92" x2="1960" y2="92" stroke="#32549C" stroke-width="3"/><rect x="40" y="118" width="360" height="422" rx="14" fill="#F4F5F7"/><rect x="64" y="140" width="88" height="38" rx="19" fill="#32549C"/><text x="108" y="160" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">원리</text><text x="62" y="214" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">peak가 유전자 구조의 어디에 있는지</text><text x="62" y="248" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">(promoter, exon, intron, intergenic 등)</text><text x="62" y="282" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">분류하고, 가장 가까운 유전자와 TSS</text><text x="62" y="316" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">까지의 거리를 붙입니다. GFF/GTF로</text><text x="62" y="350" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">TxDb를 만들어 다양한 종에 적용합니다.</text><text x="520" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A"