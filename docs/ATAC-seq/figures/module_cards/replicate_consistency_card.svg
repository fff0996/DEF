" fill="#F4F5F7"/><text x="1328" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">treated</text><text x="1438" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">trt_1</text><text x="1558" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">trt_2</text><text x="1678" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">917</text><text x="1808" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">97</text><text x="1332" y="518" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">합성 시험 데이터로 실제 실행한 결과</text></svg>