t-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#222222" dominant-baseline="middle">A paired bootstrap decides whether the model is better than each baseline</text><text x="300" y="560" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#5A5A5A" dominant-baseline="middle">resample individuals with replacement</text><text x="80" y="613" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#5A5A5A" dominant-baseline="middle">bootstrap 1</text><rect x="200" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="224" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P1</text><rect x="258" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="282" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P3</text><rect x="316" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="340" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P3</text><rect x="374" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="398" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P4</text><rect x="432" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="456" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P6</text><rect x="490" y="595" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="514" y="613" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P2</text><text x="80" y="673" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#5A5A5A" dominant-baseline="middle">bootstrap 2</text><rect x="200" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="224" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P2</text><rect x="258" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="282" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P2</text><rect x="316" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="340" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P5</text><rect x="374" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="398" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P1</text><rect x="432" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="456" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P6</text><rect x="490" y="655" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="514" y="673" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P4</text><text x="80" y="733" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#5A5A5A" dominant-baseline="middle">bootstrap 3</text><rect x="200" y="715" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="224" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P5</text><rect x="258" y="715" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="282" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P1</text><rect x="316" y="715" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="340" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#D55E00" dominant-baseline="middle">P3</text><rect x="374" y="715" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="398" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#0072B2" dominant-baseline="middle">P6</text><rect x="432" y="715" width="48" height="36" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="456" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-