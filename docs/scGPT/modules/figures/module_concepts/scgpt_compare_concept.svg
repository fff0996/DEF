<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="1800" height="900" fill="#FFFFFF"/><text x="40" y="48" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#32549C" dominant-baseline="middle">A</text><text x="80" y="48" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#222222" dominant-baseline="middle">Four methods are scored on the same individuals and the same folds</text><rect x="70" y="110" width="260" height="300" rx="12" fill="#FFFFFF" fill-opacity="1" stroke="#BBBBBB" stroke-width="2"/><text x="200" y="140" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#32549C" dominant-baseline="middle">same splits.tsv</text><rect x="100" y="175" width="54" height="46" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="127" y="198" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#D55E00" dominant-baseline="middle">P1</text><rect x="170" y="175" width="54" height="46" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="197" y="198" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#0072B2" dominant-baseline="middle">P2</text><rect x="240" y="175" width="54" height="46" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="267" y="198" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#D55E00" dominant-baseline="middle">P3</text><rect x="100" y="245" width="54" height="46" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="127" y="268" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-