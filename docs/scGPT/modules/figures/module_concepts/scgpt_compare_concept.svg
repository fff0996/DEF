r="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#222222" dominant-baseline="middle">PCA of variable genes</text><text x="460" y="236" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="500" fill="#5A5A5A" dominant-baseline="middle">patient mean of PCs → logistic regression</text><line x1="345" y1="260" x2="420" y2="298" stroke="#8A8F98" stroke-width="2"/><path d="M430,298 l-14,-8 v16 z" fill="#8A8F98"/><rect x="440" y="270" width="520" height="56" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#56B4E9" stroke-width="3"/><text x="460" y="289" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#222222" dominant-baseline="middle">scGPT embedding mean</text><text x="460" y="311" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="500" fill="#5A5A5A" dominant-baseline="middle">patient mean embedding → logistic regression</text><line x1="345" y1="260" x2="420" y2="373" stroke="#8A8F98" stroke-width="2"/><path d="M430,373 l-14,-8 v16 z" fill="#8A8F98"/><rect x="440" y="345" width="520" height="56" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#D55E00" stroke-width="3"/><text x="460" y="364" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#222222" dominant-baseline="middle">trained model</text><text x="460" y="386" text-anchor="start" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="500" fill="#5A5A5A" dominant-baseline="middle">scgpt_train cross-validation predictions</text><line x1="975" y1="260" x2="1040" y2="260" stroke="#8A8F98" stroke-width="3"/><path d="M1050,260 l-14,-8 v16 z" fill="#8A8F98"/><text x="1290" y="115" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#5A5A5A" dominant-baseline="middl