<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660"><rect width="1600" height="660" fill="#FFFFFF"/><text x="800.0" y="34.0" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#222222" text-anchor="middle" dominant-baseline="middle">One model per chromatographic condition</text><rect x="40" y="110" width="250" height="46" rx="10" fill="#4E79A7" fill-opacity="0.14" stroke="#4E79A7" stroke-width="2.5"/><text x="165.0" y="126.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">Measured RTs (RP)</text><text x="165.0" y="144.0" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">one column, mobile phase, gradient</text><rect x="40" y="180" width="250" height="46" rx="10" fill="#3A3A3A" fill-opacity="0.14" stroke="#3A3A3A" stroke-width="2.5"/><text x="165.0" y="196.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Molecular descriptors</text><text x="165.0" y="214.0" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">same 217 RDKit descriptors</text><line x1="290.0" y1="133.0" x2="340.0" y2="133.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="290.0" y1="203.0" x2="340.0" y2="203.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="340.0" y1="133.0" x2="340.0" y2="203.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="340.0" y1="168.0" x2="406.0" y2="168.0" stroke="#3A3A3A" stroke-width="3"/><path d="M420.0,168.0 L406.0,161.0 L406.0,175.0 Z" fill="#3A3A3A"/><circle cx="510" cy="168" r="84" fill="#FFFFFF" stroke="#4E79A7" stroke-width="2.5"/><text x="510.0" y="150.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">QSRR model</text><text x="510.0" y="174.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">training</text><text x="510.0" y="200.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(AutoGluon)</text><line x1="596.0" y1="168.0" x2="666.0" y2="168.0" stroke="#3A3A3A" stroke-width="3"/><path d="M680.0,168.0 L666.0,161.0 L666.0,175.0 Z" fill="#3A3A3A"/><rect x="690" y="145" width="220" height="46" rx="10" fill="#4E79A7" fill-opacity="0.14" stroke="#4E79A7" stroke-width="2.5"/><text x="800.0" y="168.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">RP model</text><line x1="912.0" y1="168.0" x2="976.0" y2="168.0" stroke="#3A3A3A" stroke-width="3"/><path d="M990.0,168.0 L976.0,161.0 L976.0,175.0 Z" fill="#3A3A3A"/><text x="1000.0" y="156.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">predicts RT under RP conditions</text><text x="1000.0" y="182.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">reversed phase: more hydrophobic compounds elute later</text><rect x="40" y="340" width="250" height="46" rx="10" fill="#E8862A" fill-opacity="0.14" stroke="#E8862A" stroke-width="2.5"/><text x="165.0" y="356.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">Measured RTs (HILIC)</text><text x="165.0" y="374.0" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">one column, mobile phase, gradient</text><rect x="40" y="410" width="250" height="46" rx="10" fill="#3A3A3A" fill-opacity="0.14" stroke="#3A3A3A" stroke-width="2.5"/><text x="165.0" y="426.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Molecular descriptors</text><text x="165.0" y="444.0" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">same 217 RDKit descriptors</text><line x1="290.0" y1="363.0" x2="340.0" y2="363.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="290.0" y1="433.0" x2="340.0" y2="433.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="340.0" y1="363.0" x2="340.0" y2="433.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="340.0" y1="398.0" x2="406.0" y2="398.0" stroke="#3A3A3A" stroke-width="3"/><path d="M420.0,398.0 L406.0,391.0 L406.0,405.0 Z" fill="#3A3A3A"/><circle cx="510" cy="398" r="84" fill="#FFFFFF" stroke="#E8862A" stroke-width="2.5"/><text x="510.0" y="380.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">QSRR model</text><text x="510.0" y="404.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">training</text><text x="510.0" y="430.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(AutoGluon)</text><line x1="596.0" y1="398.0" x2="666.0" y2="398.0" stroke="#3A3A3A" stroke-width="3"/><path d="M680.0,398.0 L666.0,391.0 L666.0,405.0 Z" fill="#3A3A3A"/><rect x="690" y="375" width="220" height="46" rx="10" fill="#E8862A" fill-opacity="0.14" stroke="#E8862A" stroke-width="2.5"/><text x="800.0" y="398.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">HILIC model</text><line x1="912.0" y1="398.0" x2="976.0" y2="398.0" stroke="#3A3A3A" stroke-width="3"/><path d="M990.0,398.0 L976.0,391.0 L976.0,405.0 Z" fill="#3A3A3A"/><text x="1000.0" y="386.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">predicts RT under HILIC conditions</text><text x="1000.0" y="412.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">HILIC: more polar compounds elute later</text><text x="40.0" y="590.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">A model predicts only the condition it was trained on, so rtpred_train builds one model per model_type.</text><text x="40.0" y="620.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">Schematic. Adapted from Xie et al., J Pharm Anal 15, 101155 (2025), Fig. 7A (CC BY 4.0); the model-based part (Fig. 7B) is left out.</text></svg>