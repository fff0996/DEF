<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660"><rect width="1600" height="660" fill="#FFFFFF"/><text x="800.0" y="34.0" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#222222" text-anchor="middle" dominant-baseline="middle">Molecular representations for RT prediction</text><rect x="620" y="90" width="360" height="140" rx="12" fill="#F5F6F8" stroke="#3A3A3A" stroke-width="2.5"/><text x="800.0" y="116.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">String of symbols</text><text x="800.0" y="148.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">SMILES, canonical SMILES, InChI</text><text x="800.0" y="172.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(input of RTpred: SMILES)</text><rect x="80" y="320" width="360" height="170" rx="12" fill="#EAF0FA" stroke="#32549C" stroke-width="2.5"/><text x="260.0" y="346.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#32549C" text-anchor="middle" dominant-baseline="middle">Molecular descriptors</text><text x="260.0" y="378.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">physicochemical values</text><text x="260.0" y="402.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">and graph operators</text><text x="260.0" y="426.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">RTpred: 217 RDKit descriptors</text><rect x="620" y="320" width="360" height="170" rx="12" fill="#FFFFFF" stroke="#A7ADB6" stroke-width="2.5"/><text x="800.0" y="346.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#A7ADB6" text-anchor="middle" dominant-baseline="middle">Molecular fingerprints</text><text x="800.0" y="378.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">MACCS keys</text><text x="800.0" y="402.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">ECFP, PFP</text><rect x="1160" y="320" width="360" height="170" rx="12" fill="#FFFFFF" stroke="#A7ADB6" stroke-width="2.5"/><text x="1340.0" y="346.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#A7ADB6" text-anchor="middle" dominant-baseline="middle">Molecular graphs</text><text x="1340.0" y="378.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">computer-generated graphs</text><text x="1340.0" y="402.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">for graph neural networks</text><line x1="700.0" y1="230.0" x2="313.7" y2="313.1" stroke="#32549C" stroke-width="3.5"/><path d="M300.0,316.0 L315.2,319.9 L312.2,306.2 Z" fill="#32549C"/><line x1="800.0" y1="230.0" x2="800.0" y2="302.0" stroke="#A7ADB6" stroke-width="3"/><path d="M800.0,316.0 L807.0,302.0 L793.0,302.0 Z" fill="#A7ADB6"/><line x1="900.0" y1="230.0" x2="1286.3" y2="313.1" stroke="#A7ADB6" stroke-width="3"/><path d="M1300.0,316.0 L1287.8,306.2 L1284.8,319.9 Z" fill="#A7ADB6"/><text x="470.0" y="262.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#32549C" text-anchor="middle" dominant-baseline="middle">convert (RDKit)</text><text x="1150.0" y="262.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">convert</text><text x="80.0" y="530.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">RTpred (like Retip) converts SMILES to descriptors and trains AutoGluon models on them.</text><text x="80.0" y="600.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">Adapted from Liu et al., J Cheminform 16, 113 (2024), Fig. 4 (CC BY 4.0); the model timeline is left out.</text></svg>