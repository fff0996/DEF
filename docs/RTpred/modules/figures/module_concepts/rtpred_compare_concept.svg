<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660"><rect width="1600" height="660" fill="#FFFFFF"/><text x="40" y="40" font-family="Pretendard, sans-serif" font-size="26" font-weight="800" fill="#32549C">A</text><text x="68.0" y="32.0" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">Evaluation rows per mode</text><rect x="60" y="100" width="200" height="46" rx="10" fill="#4E79A7" fill-opacity="0.14" stroke="#4E79A7" stroke-width="2.5"/><text x="160.0" y="123.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">RP reserved test</text><rect x="280" y="100" width="200" height="46" rx="10" fill="#E8862A" fill-opacity="0.14" stroke="#E8862A" stroke-width="2.5"/><text x="380.0" y="123.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">HILIC reserved test</text><text x="60.0" y="180.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">Default: reserved_test.csv of each mode</text><text x="60.0" y="206.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">(held out in training, never used to select)</text><text x="60.0" y="246.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">Or eval_file: SMILES, measured RT, model_type</text><text x="60.0" y="286.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">Structures used in training or validation</text><text x="60.0" y="312.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-ancho