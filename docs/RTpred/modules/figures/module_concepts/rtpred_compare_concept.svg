if" font-size="15" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">user HILIC</text><text x="580.0" y="310.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">same evaluation rows for both</text><text x="580.0" y="400.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">RP and HILIC are never compared with each other</text><text x="580.0" y="426.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">User models: all candidates or best (scope)</text><text x="1100" y="40" font-family="Pretendard, sans-serif" font-size="26" font-weight="800" fill="#32549C">C</text><text x="1128.0" y="32.0" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">Errors on the same rows</text><line x1="1150.0" y1="110.0" x2="1150.0" y2="280.0" stroke="#3A3A3A" stroke-width="2.5"/><line x1="1150.0" y1="280.0" x2="1530.0" y2="280.0" stroke="#3A3A3A" stroke-width="2.5"/><text x="1340.0" y="304.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle"></text><text x="1128.0" y="195.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#3A3A3A" text-anchor="middle" transform="rotate(-90 1128.0 195.0)">RMSE (min)</text><rect x="1190.0" y="152.5" width="50.0" height="127.5" rx="3" fill="#A7ADB6" opacity="1"/><rect x="1250.0" y="203.5" width="50.0" height="76.5" rx="3" fill="#4E79A7" opacity="0.9"/><text x="1245.0" y="302.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#4E79A7" text-anchor="middle" dominant-baseline="middle">RP</text><rect x="1370.0" y="135.5" width="50.0" height="144.5" rx="3" fill="#A7ADB6" opacity="1"/><rect x="1430.0" y="178.0" width="50.0" height="102.0" rx="3" fill="#E8862A" opacity="0.9"/><text x="1425.0" y="302.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#E8862A" text-anchor="middle" dominant-baseline="middle">HILIC</text><rect x="1160.0" y="330.0" width="18.0" height="14.0" rx="3" fill="#A7ADB6" opacity="1"/><text x="1186.0" y="337.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">pre-trained</text><rect x="1300.0" y="330.0" width="9.0" height="14.0" rx="0" fill="#4E79A7" opacity="1"/><rect x="1309.0" y="330.0" width="9.0" height="14.0" rx="0" fill="#E8862A" opacity="1"/><text x="1326.0" y="337.0" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">user (RP, HILIC)</text><text x="1110.0" y="386.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">RMSE, MAE, R² per candidate, rank, RT plot</text><text x="1110.0" y="412.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">comparison.csv joins modes (Mode column)</text><text x="1110.0" y="438.0" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">The pre-trained models stay unchanged</text></svg>