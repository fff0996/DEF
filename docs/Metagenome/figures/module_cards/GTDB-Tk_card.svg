<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="580" viewBox="0 0 2000 580"><rect width="2000" height="580" fill="#FFFFFF"/><text x="40" y="54" dominant-baseline="middle"><tspan font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="40" font-weight="700" fill="#32549C">GTDB-Tk</tspan><tspan dx="22" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#222222">계통학적 분류</tspan><tspan dx="12" font-family="Pretendard, sans-serif" font-size="22" font-weight="500" fill="#3A3A3A">(Taxonomic classification)</tspan></text><line x1="40" y1="92" x2="1960" y2="92" stroke="#32549C" stroke-width="3"/><rect x="40" y="118" width="360" height="422" rx="14" fill="#F4F5F7"/><rect x="64" y="140" width="88" height="38" rx="19" fill="#32549C"/><text x="108" y="160" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">원리</text><text x="62" y="214" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">MAG에서 보존된 단일 사본 마커 유전자</text><text x="62" y="248" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">(세균 120개, 고세균 53개)를 찾아 정렬하고</text><text x="62" y="282" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">GTDB 참조 계통수에 배치(pplacer)합니다.</text><text x="62" y="316" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">계통수상 위치와 참조 유전체와의 ANI를</text><text x="62" y="350" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">함께 이용해 도메인부터 종까지</text><text x="62" y="384" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">MAG의 분류를 결정합니다.</text><text x="520" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Input</text><text x="520" y="178" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(MAGs, .fna)</text><rect x="418" y="255" width="205" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M432,263 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="460" y="275" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">MAG_1.fna</text><rect x="418" y="311" width="205" height="38" rx="8" fill="#fff" stroke="#3A3A3A" stroke-width="2.5"/><path d="M432,319 h12 l6,6 v16 h-18 Z" fill="#3A3A3A"/><text x="460" y="331" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">MAG_2.fna</text><rect x="418" y="367" width="205" height="38" rx="8" fill="#fff" stroke="#222222" stroke-width="2.5"/><path d="M432,375 h12 l6,6 v16 h-18 Z" fill="#222222"/><text x="460" y="387" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">MAG_3.fna</text><line x1="630" y1="330" x2="660" y2="330" stroke="#3A3A3A" stroke-width="4"/><path d="M658,320 L674,330 L658,340 Z" fill="#3A3A3A"/><rect x="682" y="171.0" width="300" height="318" rx="16" fill="#fff" stroke="#32549C" stroke-width="3"/><rect x="682" y="171.0" width="300" height="62" rx="16" fill="#32549C"/><rect x="682" y="211.0" width="300" height="22" fill="#32549C"/><text x="832" y="203.0" font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">GTDB-Tk</text><rect x="696" y="242.0" width="272" height="4