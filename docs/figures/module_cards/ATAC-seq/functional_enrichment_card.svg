<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="580" viewBox="0 0 2000 580"><rect width="2000" height="580" fill="#FFFFFF"/><text x="40" y="54" dominant-baseline="middle"><tspan font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="40" font-weight="700" fill="#32549C">functional_enrichment</tspan><tspan dx="22" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#222222">GO 기능 농축 분석</tspan><tspan dx="12" font-family="Pretendard, sans-serif" font-size="22" font-weight="500" fill="#3A3A3A">(GO enrichment)</tspan></text><line x1="40" y1="92" x2="1960" y2="92" stroke="#32549C" stroke-width="3"/><rect x="40" y="118" width="360" height="422" rx="14" fill="#F4F5F7"/><rect x="64" y="140" width="88" height="38" rx="19" fill="#32549C"/><text x="108" y="160" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">원리</text><text x="62" y="214" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">peak(또는 접근성이 변한 peak)마다</text><text x="62" y="248" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">가장 가까운 유전자를 찾고, 이 유전자들이</text><text x="62" y="282" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">배경 유전자보다 어떤 GO 기능에 많이</text><text x="62" y="316" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">모여 있는지 초기하분포 검정으로</text><text x="62" y="350" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">분석합니다. 종별 OrgDb 파일을 사용해</text><text x="62" y="384" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">인터넷 연결 없이 수행합니다.</text><text x="520" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Input</text><text x="520" y="178" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(gene lists 또는 DA, 주석)</text><rect x="418" y="255" width="205" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M432,263 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="460" y="275" font-family="Pretendard, sans-serif" font-size="14.3796992481203" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">gene_lists / DA csv</text><rect x="418" y="311" width="205" height="38" rx="8" fill="#fff" stroke="#3A3A3A" stroke-width="2.5"/><path d="M432,319 h12 l6,6 v16 h-18 Z" fill="#3A3A3A"/><text x="460" y="331" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">genes.gff3</text><rect x="418" y="367" width="205" height="38" rx="8" fill="#fff" stroke="#222222" stroke-width="2.5"/><path d="M432,375 h12 l6,6 v16 h-18 Z" fill="#222222"/><text x="460" y="387" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">OrgDb.sqlite</text><line x1="630" y1="330" x2="660" y2="330" stroke="#3A3A3A" stroke-width="4"/><path d="M658,320 L674,330 L658,340 Z" fill="#3A3A3A"/><rect x="682" y="156.0" width="300" height="348" rx="16" fill="#fff" stroke="#32549C" stroke-width="3"/><rect x="682" y="156.0" width="300" height="62" rx="16" fill="#32549C"/><rect x="682" y="196.0" width="300" height="22" fill="#32549C"/><text x="832" y="188.0" font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="17.857142857142858" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">functional_enrichment</text><text x="832" y="238.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#32549C" text-anchor="middle" dominant-baseline="middle">clusterProfiler</text><rect x="696" y="257.0" width="272" height="42" rx="8" fill="#EAF0FA" stroke="#32549C" stroke-width="2"/><circle cx="718" cy="278.0" r="13" fill="#32549C"/><text x="718" y="279.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text><text x="740" y="279.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">Peak to nearest gene</text><rect x="696" y="309.0" width="272" height="42" rx="8" fill="#F4F5F7" stroke="#3A3A3A" stroke-width="2"/><circle cx="718" cy="330.0" r="13" fill="#3A3A3A"/><text x="718" y="331.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text><text x="740" y="331.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">ID matching (OrgDb)</text><rect x="696" y="361.0" width="272" height="42" rx="8" fill="#F4F5F7" stroke="#222222" stroke-width="2"/><circle cx="718" cy="382.0" r="13" fill="#222222"/><text x="718" y="383.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">3</text><text x="740" y="383.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">GO over-representation</text><rect x="696" y="413.0" width="272" height="42" rx="8" fill="#EAF0FA" stroke="#32549C" stroke-width="2"/><circle cx="718" cy="434.0" r="13" fill="#32549C"/><text x="718" y="435.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dom