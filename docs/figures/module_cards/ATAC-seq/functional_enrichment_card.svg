rif" font-size="12.5" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">DA의 up 목록, 애기장대 OrgDb</text><text x="1332" y="518" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">합성 시험 데이터로 실제 실행한 결과</text></svg>