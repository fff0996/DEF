<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="580" viewBox="0 0 2000 580"><rect width="2000" height="580" fill="#FFFFFF"/><text x="40" y="54" dominant-baseline="middle"><tspan font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="40" font-weight="700" fill="#32549C">differential_accessibility</tspan><tspan dx="22" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#222222">차등 접근성 분석</tspan><tspan dx="12" font-family="Pretendard, sans-serif" font-size="22" font-weight="500" fill="#3A3A3A">(Differential accessibility)</tspan></text><line x1="40" y1="92" x2="1960" y2="92" stroke="#32549C" stroke-width="3"/><rect x="40" y="118" width="360" height="422" rx="14" fill="#F4F5F7"/><rect x="64" y="140" width="88" height="38" rx="19" fill="#32549C"/><text x="108" y="160" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">원리</text><text x="62" y="214" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">두 조건 샘플의 peak를 합쳐 공통</text><text x="62" y="248" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">peak를 만들고 peak별 read 수를 셉니다.</text><text x="62" y="282" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">TMM으로 정규화한 뒤 quasi-likelihood</text><text x="62" y="316" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">검정으로 접근성이 증가·감소한 peak를</text><text x="62" y="350" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">찾고, GC 편향·샘플 상관·PCA로</text><text x="62" y="384" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">품질을 확인합니다.</text><text x="520" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Input</text><text x="520" y="178" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(BAM, peaks, 샘플 정보)</text><rect x="418" y="227" width="205" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M432,235 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="460" y="247" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">shifted BAM</text><rect x="418" y="283" width="205" height="38" rx="8" fill="#fff" stroke="#3A3A3A" stroke-width="2.5"/><path d="M432,291 h12 l6,6 v16 h-18 Z" fill="#3A3A3A"/><text x="460" y="303" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">narrowPeak</text><rect x="418" y="339" width="205" height="38" rx="8" fill="#fff" stroke="#222222" stroke-width="2.5"/><path d="M432,347 h12 l6,6 v16 h-18 Z" fill="#222222"/><text x="460" y="359" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">sample_data.csv</text><rect x="418" y="395" width="205" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M432,403 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="460" y="415" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">genome.fa</text><line x1="630" y1="330" x2="660" y2="330" stroke="#3A3A3A" stroke-width="4"/><path d="M658,320 L674,330 L658,340 Z" fill="#3A3A3A"/><rect x="682" y="130.0" width="300" height="400" rx="16" fill="#fff" stroke="#32549C" stroke-width="3"/><rect x="682" y="13