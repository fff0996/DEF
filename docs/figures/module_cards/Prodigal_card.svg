<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="580" viewBox="0 0 2000 580"><rect width="2000" height="580" fill="#FFFFFF"/><text x="40" y="54" dominant-baseline="middle"><tspan font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="40" font-weight="700" fill="#32549C">Prodigal</tspan><tspan dx="22" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#222222">유전자 예측</tspan><tspan dx="12" font-family="Pretendard, sans-serif" font-size="22" font-weight="500" fill="#3A3A3A">(Gene prediction)</tspan></text><line x1="40" y1="92" x2="1960" y2="92" stroke="#32549C" stroke-width="3"/><rect x="40" y="118" width="360" height="422" rx="14" fill="#F4F5F7"/><rect x="64" y="140" width="88" height="38" rx="19" fill="#32549C"/><text x="108" y="160" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">원리</text><text x="62" y="214" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">원핵생물 유전체에서 시작·종결 코돈,</text><text x="62" y="248" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">리보솜 결합 부위(RBS), GC 편향을 이용해</text><text x="62" y="282" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">단백질 암호화 유전자(CDS)를 예측합니다.</text><text x="62" y="316" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">여러 생물이 섞이거나 짧은 서열(MAG)은</text><text x="62" y="350" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">메타게놈 모드(-p meta)로 분석합니다.</text><text x="62" y="384" font-family="Pretendard, sans-serif" font-size="17.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">tRNA·rRNA는 예측하지 않습니다.</text><text x="520" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Input</text><text x="520" y="178" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(MAG, .fna)</text><rect x="418" y="311" width="205" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M432,319 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="460" y="331" font-family="Pretendard, sans-serif" font-size="17" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">MAG_1.fna</text><line x1="630" y1="330" x2="660" y2="330" stroke="#3A3A3A" stroke-width="4"/><path d="M658,320 L674,330 L658,340 Z" fill="#3A3A3A"/><rect x="682" y="197.0" width="300" height="266" rx="16" fill="#fff" stroke="#32549C" stroke-width="3"/><rect x="682" y="197.0" width="300" height="62" rx="16" fill="#32549C"/><rect x="682" y="237.0" width="300" height="22" fill="#32549C"/><text x="832" y="229.0" font-family="'Gmarket Sans TTF', 'GmarketSans', Pretendard, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Prodigal</text><rect x="696" y="268.0" width="272" height="42" rx="8" fill="#EAF0FA" stroke="#32549C" stroke-width="2"/><circle cx="718" cy="289.0" r="13" fill="#32549C"/><text x="718" y="290.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text><text x="740" y="290.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">Coding potential scoring</text><rect x="696" y="320.0" width="272" height="42" rx="8" fill="#F4F5F7" stroke="#3A3A3A" stroke-width="2"/><circle cx="718" cy="341.0" r="13" fill="#3A3A3A"/><text x="718" y="342.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text><text x="740" y="342.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">Start codon and RBS selection</text><rect x="696" y="372.0" width="272" height="42" rx="8" fill="#F4F5F7" stroke="#222222" stroke-width="2"/><circle cx="718" cy="393.0" r="13" fill="#222222"/><text x="718" y="394.0" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">3</text><text x="740" y="394.0" font-family="Pretendard, sans-serif" font-size="15.5" font-weight="600" fill="#222222" text-anchor="start" dominant-baseline="middle">Gene calling</text><text x="832" y="439.0" font-family="Pretendard, sans-serif" font-size="16" font-weight="600" fill="#32549C" text-anchor="middle" dominant-baseline="middle">mode: -p meta</text><line x1="988" y1="330" x2="1016" y2="330" stroke="#3A3A3A" stroke-width="4"/><path d="M1014,320 L1030,330 L1014,340 Z" fill="#3A3A3A"/><text x="1166" y="150" font-family="Pretendard, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">Output</text><text x="1166" y="178" font-family="Pretendard, sans-serif" font-size="17" font-weight="500" fill="#3A3A3A" text-anchor="middle" dominant-baseline="middle">(gene prediction files)</text><rect x="1036" y="255" width="260" height="38" rx="8" fill="#fff" stroke="#32549C" stroke-width="2.5"/><path d="M1050,263 h12 l6,6 v16 h-18 Z" fill="#32549C"/><text x="1078" y="275" font-family="Pretendard, sans-serif" font-size="16.149068322981364" font-weight="600" fill="#32549C" text-anchor="start" dominant-baseline="middle">.gff (gene coordinates)</text><rect x="1036" y="311" width="260" height="38" rx="8" fill="#fff" stroke="#3A3A3A" stroke-width="2.5"/><path d="M1050,319 h12 l6,6 v16 h-18 Z" fill="#3A3A3A"/