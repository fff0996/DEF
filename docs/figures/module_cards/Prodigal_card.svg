04" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">2045</text><text x="1656" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">−</text><text x="1708" y="266" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">ID=1_2;partial=00;start_type=ATG</text><text x="1328" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">contig_1</text><text x="1398" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">Prodigal_v2.6.3</text><text x="1510" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">CDS</text><text x="1552" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">2101</text><text x="1604" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">3330</text><text x="1656" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">+</text><text x="1708" y="304" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#222222" text-anchor="start" dominant-baseline="middle">ID=1_3;partial=00;start_type=GTG</text><text x="1332" y="518" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="500" fill="#3A3A3A" text-anchor="start" dominant-baseline="middle">값은 형식 설명용 예시</text><line x1="1332" y1="470" x2="1632" y2="470" stroke="#3A3A3A" stroke-width="2"/><path d="M13